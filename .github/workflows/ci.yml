# Build e suite read-only con il csc.exe del .NET Framework incluso nell'immagine Windows.
# --ui e --render sono esclusi: aprono finestre e richiedono una sessione desktop interattiva.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        shell: cmd
        run: .\build.cmd
      - name: Test
        shell: cmd
        run: .\test.cmd --artifact --read-only
